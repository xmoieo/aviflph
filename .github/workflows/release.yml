name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
            cc: gcc
            ext: ""
            libext: .so

          - target: linux-arm64
            runner: ubuntu-latest
            goos: linux
            goarch: arm64
            cc: aarch64-linux-gnu-gcc
            ext: ""
            libext: .so

          - target: linux-riscv64
            runner: ubuntu-latest
            goos: linux
            goarch: riscv64
            cc: riscv64-linux-gnu-gcc
            ext: ""
            libext: .so

          - target: windows-amd64
            runner: ubuntu-latest
            goos: windows
            goarch: amd64
            cc: x86_64-w64-mingw32-gcc
            ext: .exe
            libext: .dll

          - target: darwin-arm64
            runner: macos-latest
            goos: darwin
            goarch: arm64
            cc: clang
            ext: ""
            libext: .dylib

          - target: android-arm64
            runner: ubuntu-latest
            goos: android
            goarch: arm64
            cc: aarch64-linux-android35-clang
            ext: ""
            libext: .so

          - target: wasm
            runner: ubuntu-latest
            goos: js
            goarch: wasm
            cc: ""
            ext: .wasm
            libext: ""

    runs-on: ${{ matrix.runner }}
    name: Build ${{ matrix.target }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux cross toolchains
        if: runner.os == 'Linux' && matrix.goos == 'linux' && matrix.goarch != 'amd64'
        run: |
          sudo apt-get update
          case "${{ matrix.goarch }}" in
            arm64)   sudo apt-get install -y gcc-aarch64-linux-gnu ;;
            riscv64) sudo apt-get install -y gcc-riscv64-linux-gnu ;;
          esac

      - name: Install mingw-w64
        if: matrix.goos == 'windows'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Install Android NDK
        if: matrix.goos == 'android'
        run: |
          NDK_VERSION=r27c
          wget -q "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip" -O ndk.zip
          unzip -q ndk.zip
          NDK_PATH="$PWD/android-ndk-${NDK_VERSION}"
          echo "NDK_PATH=${NDK_PATH}" >> "$GITHUB_ENV"
          echo "${NDK_PATH}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Build CLI
        if: matrix.target != 'wasm'
        run: |
          OUT="aviflph-${{ matrix.target }}${{ matrix.ext }}"

          if [ "${{ matrix.goos }}" = "android" ]; then
            CGO_FLAG=1
          else
            CGO_FLAG=0
          fi

          GOOS=${{ matrix.goos }} \
          GOARCH=${{ matrix.goarch }} \
          CGO_ENABLED=${CGO_FLAG} \
          CC="${{ matrix.cc }}" \
            go build -trimpath -ldflags "-s -w" -o "$OUT" ./cmd/aviflph
          echo "CLI_OUT=${OUT}" >> "$GITHUB_ENV"

      - name: Build C shared library
        if: matrix.target != 'wasm'
        run: |
          LIB="libaviflph-${{ matrix.target }}${{ matrix.libext }}"

          GOOS=${{ matrix.goos }} \
          GOARCH=${{ matrix.goarch }} \
          CGO_ENABLED=1 \
          CC="${{ matrix.cc }}" \
            go build -buildmode=c-shared \
              -trimpath -ldflags "-s -w" \
              -o "$LIB" ./cmd/lpshared

          echo "LIB_OUT=${LIB}" >> "$GITHUB_ENV"

      - name: Build WASM
        if: matrix.target == 'wasm'
        run: |
          GOOS=js GOARCH=wasm CGO_ENABLED=0 \
            go build -trimpath -ldflags "-s -w" \
              -o aviflph.wasm ./cmd/lpwasm
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" wasm_exec.js

      - name: Collect and package artifacts
        run: |
          TAG="${GITHUB_REF#refs/tags/}"

          # --- CLI executable ---
          if [ -n "${{ env.CLI_OUT }}" ]; then
            CLI_NAME="aviflph-${{ matrix.target }}${{ matrix.ext }}"
            mkdir -p "pkg-cli/${{ matrix.target }}"
            cp "${{ env.CLI_OUT }}" "pkg-cli/${{ matrix.target }}/"
            (cd "pkg-cli" && zip -r "../${CLI_NAME}.zip" "${{ matrix.target }}")
          fi

          # --- C shared library + header ---
          if [ -n "${{ env.LIB_OUT }}" ]; then
            LIB_NAME="libaviflph-${{ matrix.target }}"
            HEADER="$(echo "${{ env.LIB_OUT }}" | sed 's/\.[^.]*$/.h/')"
            mkdir -p "pkg-lib/${{ matrix.target }}"
            cp "${{ env.LIB_OUT }}" "pkg-lib/${{ matrix.target }}/"
            cp "${HEADER}" "pkg-lib/${{ matrix.target }}/" 2>/dev/null || true
            (cd "pkg-lib" && zip -r "../${LIB_NAME}.zip" "${{ matrix.target }}")
          fi

          # --- WASM ---
          if [ -f "aviflph.wasm" ]; then
            mkdir -p "pkg-wasm"
            cp aviflph.wasm wasm_exec.js "pkg-wasm/"
            (cd "pkg-wasm" && zip -r "../aviflph-wasm.zip" .)
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: "*.zip"

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate release notes
        id: notes
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PREV=$(git tag --sort=-v:refname | grep -A1 "^${TAG}$" | tail -1)

          if [ -n "$PREV" ] && [ "$PREV" != "$TAG" ]; then
            RANGE="${PREV}..${TAG}"
          else
            RANGE="$(git rev-list --max-parents=0 HEAD)..${TAG}"
          fi

          echo "## What's Changed" > notes.md
          echo "" >> notes.md
          git log "$RANGE" --pretty=format:"- %s (%h)" --no-merges >> notes.md
          echo "" >> notes.md
          echo "" >> notes.md
          echo "## Downloads" >> notes.md
          echo "" >> notes.md
          echo "### CLI 可执行文件" >> notes.md
          echo "" >> notes.md
          echo "| 平台 | 文件 |" >> notes.md
          echo "|------|------|" >> notes.md
          echo "| Linux x86_64 | \`aviflph-linux-amd64.zip\` |" >> notes.md
          echo "| Linux ARM64 | \`aviflph-linux-arm64.zip\` |" >> notes.md
          echo "| Linux RISC-V 64 | \`aviflph-linux-riscv64.zip\` |" >> notes.md
          echo "| Windows x86_64 | \`aviflph-windows-amd64.zip\` |" >> notes.md
          echo "| macOS ARM64 | \`aviflph-darwin-arm64.zip\` |" >> notes.md
          echo "| Android ARM64 | \`aviflph-android-arm64.zip\` |" >> notes.md
          echo "" >> notes.md
          echo "### C 动态库（含头文件）" >> notes.md
          echo "" >> notes.md
          echo "| 平台 | 文件 |" >> notes.md
          echo "|------|------|" >> notes.md
          echo "| Linux x86_64 | \`libaviflph-linux-amd64.zip\` |" >> notes.md
          echo "| Linux ARM64 | \`libaviflph-linux-arm64.zip\` |" >> notes.md
          echo "| Linux RISC-V 64 | \`libaviflph-linux-riscv64.zip\` |" >> notes.md
          echo "| Windows x86_64 | \`libaviflph-windows-amd64.zip\` |" >> notes.md
          echo "| macOS ARM64 | \`libaviflph-darwin-arm64.zip\` |" >> notes.md
          echo "| Android ARM64 | \`libaviflph-android-arm64.zip\` |" >> notes.md
          echo "" >> notes.md
          echo "### WebAssembly" >> notes.md
          echo "" >> notes.md
          echo "| 文件 |" >> notes.md
          echo "|------|" >> notes.md
          echo "| \`aviflph-wasm.zip\` |" >> notes.md
          echo "" >> notes.md
          echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV:-$(git rev-list --max-parents=0 HEAD)}...${TAG}" >> notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: notes.md
          files: artifacts/*
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') }}
