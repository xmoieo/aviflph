<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Photo 查看器 (AVIF + 内嵌 MP4)</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #0f1115;
      color: #e8eaed;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      padding: 16px 24px;
      border-bottom: 1px solid #222;
      flex: 0 0 auto;
    }
    header h1 { margin: 0; font-size: 14px; font-weight: 600; }
    header p  { margin: 4px 0 0; color: #9aa0a6; font-size: 13px; }
    .stage {
      flex: 1 1 auto;
      display: flex;
      gap: 16px;
      padding: 16px;
      align-items: center;
      justify-content: center;
      min-height: 0;
    }
    .pane {
      flex: 0 1 auto;
      background: transparent;
      border: none;
      border-radius: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 100%;
      max-height: 100%;
      min-width: 0;
      min-height: 0;
    }
    .pane h2 {
      margin: 0 0 10px;
      font-size: 14px;
      color: #9aa0a6;
      font-weight: 500;
      flex: 0 0 auto;
    }
    .pane .media {
      flex: 0 1 auto;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border-radius: 0;
      overflow: hidden;
      max-width: 100%;
      max-height: 100%;
      min-height: 50vh;
      min-width: 0;
    }
    .pane img {
      max-width: 100%;
      max-height: calc(100vh - 120px);
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      margin: 0;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .pane img.loaded { opacity: 1; }
    .pane video {
      max-width: 100%;
      max-height: calc(100vh - 120px);
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      margin: 0;
    }
    .media-spinner {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 34px;
      height: 34px;
      margin: -17px 0 0 -17px;
      border: 3px solid rgba(255, 255, 255, 0.25);
      border-top-color: rgba(255, 255, 255, 0.85);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      z-index: 1;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* 图片右上角播放按钮 */
    .play-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      transition: background 0.15s;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }
    .play-btn:hover { background: rgba(0, 0, 0, 0.85); }
    /* 点击后在图片上叠加播放的视频 */
    .overlay {
      position: absolute;
      inset: 0;
      display: none;
      background: #000;
      z-index: 3;
    }
    .overlay.show { display: block; }
    .overlay-video { width: 100%; height: 100%; object-fit: contain; }
    .close-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 4;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }
    .close-btn:hover { background: rgba(0, 0, 0, 0.9); }
    .err {
      color: #ff6b6b;
      font-size: 13px;
      padding: 12px;
      white-space: pre-wrap;
    }
    footer { padding: 8px 24px 24px; color: #9aa0a6; font-size: 12px; flex: 0 0 auto; }
    code { background: #222; padding: 1px 5px; border-radius: 4px; }
    /* 窄屏:上下堆叠,各占一半高度 */
    @media (max-width: 720px) {
      .stage { flex-direction: column; }
      .pane { min-height: 0; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Live Photo</h1>
  </header>

  <div class="stage">
    <section class="pane">
      <h2>照片</h2>
      <div class="media">
          <img alt="xomu 照片" />
      </div>
    </section>
  </div>

  <div id="status" class="err"></div>

  <script src="js/aviflph.js"></script>
</body>
</html>
